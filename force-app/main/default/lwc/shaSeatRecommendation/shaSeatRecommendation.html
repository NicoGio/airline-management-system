<template>
    <div class="concierge-container">
        
        <template if:true={isLoading}>
            <div class="spinner-overlay">
                <lightning-spinner alternative-text="Agentforce is thinking..." size="medium" variant="brand"></lightning-spinner>
            </div>
        </template>

        <template if:true={errorMessage}>
            <div class="error-banner">{errorMessage}</div>
        </template>

        <template if:true={recommendedSeat}>
            <!-- AI Recommendation Card -->
            <div class="premium-card">
                
                <div class="card-header">
                    <lightning-icon icon-name="utility:magicwand" size="small" class="ai-icon"></lightning-icon>
                    <span class="ai-title">Agentforce Suggestion</span>
                </div>

                <div class="flight-context">
                    <p>Flight {flightInfo.flight} • {flightInfo.aircraft}</p>
                </div>

                <div class="seat-focus">
                    <h1 class="seat-code">{recommendedSeat.code}</h1>
                    <p class="seat-tier">{recommendedSeat.tier}</p>
                </div>

                <div class="seat-features">
                    <template for:each={recommendedSeat.features} for:item="feature">
                        <span key={feature} class="feature-badge">✓ {feature}</span>
                    </template>
                </div>

                <template if:false={isConfirmed}>
                    <button class="btn-confirm" onclick={confirmSuggestion}>
                        Accept Seat {recommendedSeat.code}
                    </button>
                </template>

                <template if:true={isConfirmed}>
                    <div class="success-message">
                        <lightning-icon icon-name="utility:check" size="small" variant="success"></lightning-icon>
                        <span>Seat {recommendedSeat.code} Confirmed!</span>
                    </div>
                </template>

            </div>
        </template>

    </div>
</template>
