<template>
    <!-- Master Seating Board Cardboard Box -->
    <div class="bg-white/15 backdrop-blur-lg border border-white/20 rounded-2xl p-6 text-white shadow-2xl max-w-2xl mx-auto my-6 animate-fade-in">
        
        <!-- Loading Framework State Indicator -->
        <template if:true={isLoading}>
            <div class="flex flex-col justify-center items-center p-8 gap-3">
                <lightning-spinner alternative-text="Locking rows and compiling matrix configurations..." size="medium" variant="brand"></lightning-spinner>
                <p class="text-xs text-gray-300 font-mono animate-pulse">Evaluating seat inventory availability...</p>
            </div>
        </template>

        <!-- System Architecture Error Alert Banner -->
        <template if:true={errorMessage}>
            <div class="bg-red-500/25 border border-red-500 text-red-200 p-4 rounded-xl mb-5 text-sm font-semibold flex items-center gap-2">
                <span>⚠️</span> {errorMessage}
            </div>
        </template>

        <!-- Operational Workspace Layer -->
        <template if:true={isComponentVisible}>
            <template if:false={isLoading}>
                
                <!-- Flight Context Header Section -->
                <div class="border-b border-white/10 pb-4 mb-6 flex justify-between items-center">
                    <div>
                        <h3 class="text-xl font-black tracking-wide text-white">Select Your Seat</h3>
                        <p class="text-xs text-gray-300 font-medium">Flight {flightInfo.flight} • {flightInfo.aircraft}</p>
                    </div>
                    <span class="bg-[#00A86B]/20 text-[#00A86B] text-xs font-bold px-3 py-1 rounded-full border border-[#00A86B]/30 tracking-wider uppercase">Live Cabin</span>
                </div>

                <!-- Interactive Fuselage Grid Matrix Map -->
                <div class="bg-black/30 rounded-xl p-6 mb-6 max-h-[340px] overflow-y-auto border border-white/10 flex flex-col gap-6">
                    <!-- Corrected associated loop directives to comply with LWC1044 -->
                    <template for:each={cabinLayoutRows} for:item="cabin">
                        <div key={cabin.name} class="w-full">
                            <h4 class="text-[10px] font-bold uppercase tracking-widest text-[#D4AF37] mb-4 text-center">{cabin.name} Class</h4>
                            
                            <!-- Rows Iterator Block -->
                            <div class="flex flex-col gap-2.5">
                                <template for:each={cabin.rows} for:item="row">
                                    <div key={row.index} class="flex items-center justify-center gap-4">
                                        <span class="text-[10px] font-mono text-gray-400 w-6 text-right font-bold">{row.index}</span>
                                        
                                        <!-- Seats Iterator Block -->
                                        <div class="flex gap-2">
                                            <template for:each={row.seats} for:item="seat">
                                                <button 
                                                    key={seat.code}
                                                    disabled={seat.isDisabled}
                                                    class={seat.computedStyleClass}
                                                    data-code={seat.code}
                                                    onclick={handleSeatSelectionClick}>
                                                    {seat.code}
                                                </button>
                                            </template>
                                        </div>
                                        
                                        <span class="text-[10px] font-mono text-gray-400 w-6 text-left font-bold">{row.index}</span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Transaction Review & Purchase Footer Interface -->
                <div class="bg-black/20 border border-white/10 rounded-xl p-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div class="text-center sm:text-left">
                        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Target Assignment</p>
                        <h2 class="text-2xl font-black text-white tracking-tight">{selectedSeatLabel}</h2>
                    </div>

                    <template if:false={isConfirmed}>
                        <button 
                            disabled={isSubmitDisabled}
                            class="w-full sm:w-auto bg-[#00A86B] hover:bg-green-600 disabled:bg-gray-700 disabled:text-gray-400 disabled:cursor-not-allowed text-white font-bold py-3 px-8 rounded-xl transition-all shadow-lg text-sm tracking-wide"
                            onclick={processTransactionHoldRequest}>
                            Confirm Selection
                        </button>
                    </template>

                    <template if:true={isConfirmed}>
                        <div class="bg-[#00A86B]/20 border border-[#00A86B] text-green-300 font-bold px-5 py-3 rounded-xl flex items-center gap-2 text-sm animate-scale-up">
                            <span>🏆 Seat Confirmed! Boarding Line Item Created.</span>
                        </div>
                    </template>
                </div>

            </template>
        </template>
    </div>
</template>
