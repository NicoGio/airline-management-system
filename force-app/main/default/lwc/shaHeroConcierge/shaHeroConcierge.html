<template>
    <div class="app-container" style={backgroundStyle}>
        
        <header class="header-nav">
            <div class="brand-container">
                <template if:true={resolvedBrandLogoUrl}>
                    <img src={resolvedBrandLogoUrl} alt="SkyHigh Airlines Logo" class="brand-logo" />
                </template>
                <template if:false={resolvedBrandLogoUrl}>
                    <span class="brand-text-fallback">SkyHigh</span>
                </template>
            </div>

            <nav class="nav-links">
                <a href="#" class="nav-item">{navLabel1}</a>
                <a href="#" class="nav-item">{navLabel2}</a>
                <a href="#" class="nav-item">{navLabel3}</a>
            </nav>
        </header>

        <main class="main-content">
            
            <div class="hero-text-section">
                <h1 class="hero-greeting">{currentHeroTitle}</h1>
                <p class="hero-subgreeting">{currentHeroSubtitle}</p>
            </div>

            <div class="interactive-panel-section">
                
                <template if:false={showFlightCard}>
                    <div class="glass-panel chat-wrapper-card">
                        <div class="panel-header">
                            <span class="status-indicator-online"></span>
                            <h3>{agentforceConciergeTitle}</h3>
                        </div>
                        <div class="chat-placeholder-body">
                            <p>AI Travel Assistant Active...</p>
                        </div>
                    </div>
                </template>

                <template if:true={showFlightCard}>
                    <div class="glass-panel flight-card-modal-view">
                        <div class="modal-badge-container">
                            <span class="badge-title">{modalTitle}</span>
                            <span class="badge-status-available">Available</span>
                        </div>
                        
                        <div class="route-display-container">
                            <div class="route-node">
                                <span class="iata-code">EZE</span>
                                <span class="city-name">Buenos Aires</span>
                            </div>
                            <div class="route-connector">
                                <span class="flight-duration-eta">13h 45m</span>
                            </div>
                            <div class="route-node">
                                <span class="iata-code">{selectedDestinationCode}</span>
                                <span class="city-name">Destination</span>
                            </div>
                        </div>

                        <div class="ai-picker-injection-zone">
                            <c-sha-seat-recommendation 
                                onseatselection={proceedToSeatPicker}>
                            </c-sha-seat-recommendation>
                        </div>

                        <div class="modal-footer-actions">
                            <button class="btn-secondary" onclick={closeFlightCard}>
                                {modalCloseText}
                            </button>
                        </div>
                    </div>
                </template>

            </div>
        </main>
    </div>
</template>
