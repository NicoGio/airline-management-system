<!--
  A.E.G.I.S. Component: shaHeroConcierge
  Clean Conversational Hero Template with Embedded Hardware-Accelerated Typing Indicator
-->
<template>
    <div class="skyhigh-master-wrapper" style={dynamicBackgroundStyle}>
        
        <!-- Brand Logo -->
        <div class="skyhigh-logo-container" lwc:if={logoUrl}>
            <img src={logoUrl} alt="SkyHigh Airlines Logo" class="skyhigh-logo" />
        </div>

        <div class="skyhigh-hero-container">
            <!-- Left Region: Hero Narrative -->
            <div class="skyhigh-left-panel">
                <div class="skyhigh-hero-text">
                    <h1 class="skyhigh-headline">{heroGreetingText}</h1>
                    <p class="skyhigh-subheadline">{heroSubGreetingText}</p>
                </div>
            </div>

            <!-- Right Region: Glassmorphism Conversational Panel -->
            <div class="skyhigh-chat-panel glassmorphism-panel">
                <div class="chat-header">
                    <h2>{agentforceConciergeTitle}</h2>
                </div>
                
                <!-- Chat Conversation Scroll Area -->
                <div class="chat-messages-container" lwc:ref="chatContainer">
                    <template for:each={chatMessages} for:item="msg">
                        <div key={msg.id} class="message-row">
                            <div class={msg.computedClass}>
                                <p>{msg.text}</p>
                            </div>
                        </div>
                    </template>

                    <!-- Pulsing Typing Indicator for Agent Processing -->
                    <template lwc:if={isLoading}>
                        <div class="message-row agent-typing-row">
                            <div class="bubble-agent typing-indicator-bubble">
                                <span class="typing-dot"></span>
                                <span class="typing-dot"></span>
                                <span class="typing-dot"></span>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Input Controls -->
                <div class="chat-input-container">
                    <input 
                        type="text" 
                        class="chat-input" 
                        placeholder="Tell us what you want to experience..." 
                        value={currentInputText} 
                        onkeydown={handleKeyDown} 
                        disabled={isLoading} 
                    />
                    <button class="send-btn" onclick={handleSendMessage} disabled={isLoading}>
                        <span>&#8594;</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</template>
